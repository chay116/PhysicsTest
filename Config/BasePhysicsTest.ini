; BasePhysicsTest.ini - lowest layer of the profile system (docs/02_Architecture.md 10, DL18, DL44).
; Every value here is a UE 5.8.3 default or a harness default, stated explicitly. PhysicsTest.Profile.BaseMatchesBuiltIn
; checks that each value equals the code default of the struct it configures, so the two cannot drift apart.
;
; As in a UE game, ALL UE physics keys - the UPhysicsSettingsCore fields included - live in
; [/Script/Engine.PhysicsSettings] (BaseEngine.ini:3406 [V]; UPhysicsSettings derives from UPhysicsSettingsCore).
; There is deliberately no [/Script/PhysicsCore.PhysicsSettingsCore] section; the resolver rejects it (DL44).
; Values may be pasted from a project's DefaultEngine.ini; UE keys the harness does not model are kept and reported.
; Floats are written with the shortest text that round-trips the float UE uses (e.g. 1.f / 30.f = 0.033333335).
; Evidence tags: [V] read in the local UE / SDK source.

[/Script/Engine.PhysicsSettings]
; --- UPhysicsSettingsCore (PhysicsCore/Private/PhysicsSettingsCore.cpp:27-49 [V]) ---
DefaultGravityZ=-980.0
SimulateScratchMemorySize=262144
bEnableEnhancedDeterminism=False
bEnableShapeSharing=False
bEnablePCM=True
bEnableStabilization=False
BounceThresholdVelocity=200.0
; zero-initialised UObject members (PhysicsSettingsCore.h:83-95 [V]): Average, Average, 0
FrictionCombineMode=Average
RestitutionCombineMode=Average
; deg/s, 10 revolutions per second = 62.83 rad/s
MaxAngularVelocity=3600.0
MaxDepenetrationVelocity=0.0
ContactOffsetMultiplier=0.02
MinContactOffset=2.0
MaxContactOffset=8.0
; FChaosSolverConfiguration (ChaosSolverConfiguration.cpp:8-26, PBDRigidsEvolutionGBF.h:62-69 [V]); harness subset
SolverOptions=(PositionIterations=8,VelocityIterations=2,ProjectionIterations=1,CollisionMarginFraction=0.05,CollisionMarginMax=10.0,CollisionCullDistance=3.0,CollisionMaxPushOutVelocity=1000.0,CollisionInitialOverlapDepenetrationVelocity=-1.0)
; --- UPhysicsSettings (Engine/Private/PhysicsEngine/PhysicsSettings.cpp:14-38 [V]) ---
; UE_SMALL_NUMBER
MinPhysicsDeltaTime=1e-08
; 1.f / 30.f
MaxPhysicsDeltaTime=0.033333335
; The harness tick mode is [/Script/PhysicsTest.PhysicsTestSettings] TickMode; these two UE switches are kept for
; parity and a mismatch with TickMode is reported as a warning.
bSubstepping=False
bTickPhysicsAsync=False
; 1.f / 30.f
AsyncFixedTimeStepSize=0.033333335
; 1.f / 60.f
MaxSubstepDeltaTime=0.016666668
MaxSubsteps=6
PhysXTreeRebuildRate=10
; FChaosPhysicsSettings (PhysicsSettings.cpp:197-203 [V]); the bench maps the thread count T instead (02 9.6)
ChaosSettings=(DefaultThreadingModel=TaskGraph)

[/Script/PhysicsTest.PhysicsTestSettings]
; Harness settings (docs/02_Architecture.md 9-10, A.6). FixedStep is the bench default; MVP scenes use FixedStep / Sync.
TickMode=FixedStep
; 1.f / 60.f
FixedDeltaTime=0.016666668
; UE5ChaosScene for every engine; a PhysX UE4Compat variant may select UE4PhysSubstep (EngineDefault key, 02 8.2)
SubstepClampRule=UE5ChaosScene
FrameDriver=Auto
MassRule=UEBodyUtils
bAllowSleeping=True
; <= 0: each engine's UEParity mapping (02 10, DL35, Q11)
RestitutionThresholdVelocity=-1.0
RunMode=Bench
InstrumentFlags=0
NumThreads=1
AffinityMask=0x1
; 0 = final frame only (headline runs, DL22)
HashEvery=0
CountersEvery=0
CaptureEvery=0

[/Script/PhysicsTest.BodyInstanceDefaults]
; Applied to body templates BEFORE a scenario authors them. UE FBodyInstance defaults (BodyInstance.cpp:357-418 [V])
; and FBodyInstanceCore defaults (BodyInstanceCore.cpp:13-24 [V]).
bEnableGravity=True
bGyroscopicTorqueEnabled=False
bStartAwake=True
MassScale=1.0
LinearDamping=0.01
AngularDamping=0.0
bOverrideMaxAngularVelocity=False
; UE initialises it from UPhysicsSettings::MaxAngularVelocity (deg/s)
MaxAngularVelocity=3600.0
bOverrideMaxDepenetrationVelocity=False
MaxDepenetrationVelocity=0.0
bUseCCD=False
bInertiaConditioning=True
SleepFamily=Normal
CustomSleepThresholdMultiplier=1.0
StabilizationThresholdMultiplier=1.0
bOverrideIterationCounts=False
PositionSolverIterationCount=8
VelocitySolverIterationCount=2
ProjectionSolverIterationCount=1

[/Script/PhysicsTest.PhysicalMaterialDefaults]
; Applied to material templates before authoring, and to the scene's default material (UE: GEngine->DefaultPhysMaterial).
; UPhysicalMaterial defaults (PhysicsCore/Private/PhysicalMaterial.cpp:42-60 [V]).
Friction=0.7
StaticFriction=0.0
Restitution=0.3
FrictionCombineMode=Average
bOverrideFrictionCombineMode=False
RestitutionCombineMode=Average
bOverrideRestitutionCombineMode=False
; g/cm^3
Density=1.0
RaiseMassToPower=0.75
SleepLinearVelocityThreshold=1.0
SleepAngularVelocityThreshold=0.05
SleepCounterThreshold=4
