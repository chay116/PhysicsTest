; PhysX.SdkDefault.ini - backend variant "PhysX 5.11 with its own SDK defaults" (docs/02_Architecture.md 8.2, 10; 03 M5).
; The same UE4-style integration (creation order, filter shader, harness mass properties) with the engine left at what a
; plain PhysX 5.11 program gets: SI units and PxTolerancesScale (1, 10). That scale is process-wide (PxPhysics.h:997
; [V]), so this variant needs its own process: the host refuses it in a process whose PhysX module was initialised with
; the UE4Compat family's (100, 1000) (PT_MODULE_GLOBAL_SCENE_SETTINGS), and so does CreateScene (LengthScale 0.01 needs
; tolerances length 1).
; Body values (damping, the angular limit, sleep on / off) are the physics profile's for every engine; this file sets
; only what the engine decides itself.
; A variant may set only [PhysicsTest.Backend.PhysX] / [PhysicsTest.Backend.PhysX.Init] keys and the keys the physics
; profile marks EngineDefault (02 10). Lengths are in cm and velocities in cm/s (the backend converts to m).
; Evidence tags: [V] read in the pinned PhysX source (out/<preset>/_deps/physx-src, da950a35); [D] harness design decision.

[PhysicsTest.Variant]
Engine=PhysX
Name=SdkDefault
Label=PhysX 5.11 (SDK defaults)
+FidelityNotes=UE4 settings on PhysX 5.11 is the UE4Compat row; this one keeps PhysX 5.11's own defaults (UE4 shipped PhysX 3.4.0.0, not 5.11)
+FidelityNotes=PhysX 5.11 differs from 3.4: improved patch friction is always on, joint projection and the eSWING drive are gone, PxCooking is gone (PxCreateConvexMesh), max depenetration velocity must be > 0, the default broad phase is PABP
+FidelityNotes=Tolerances scale (1, 10) is process-wide: never in one process with UE4Compat / -TGS / -Stab

[PhysicsTest.Backend.PhysX.Init]
; [V] PxTolerancesScale() defaults: length 1 (m), speed 10 (m/s) (PxTolerancesScale.h:55)
ToleranceScale=(Length=1,Speed=10)

[PhysicsTest.Backend.PhysX]
; [D] D1: m (0.01 native units per cm)
LengthScale=0.01
; [V] PxSceneDesc defaults: ePABP (PxSceneDesc.h:1076), ePGS (:1081), flags eENABLE_PCM only (:1086)
BroadPhaseType=PABP
SolverType=PGS
bEnablePCM=True
bEnableStabilization=False
bEnableEnhancedDeterminism=False
bEnableCCD=False
; [V] eENABLE_ACTIVE_ACTORS is not a default flag: the harness visits every body for its active reads (02 9.4)
bEnableActiveActors=False
; [V] PxPairFilteringMode::eDEFAULT = eSUPPRESS (PxFiltering.h:707)
KineKineFilteringMode=Suppress
StaticKineFilteringMode=Suppress
; [D] the same UE4-style filter shader and its default rules (PhysicsFiltering.h; eSUPPRESS above keeps kinematic-static
; pairs from reaching it)
NonBlockingPairFilter=Kill
KinematicStaticPairFilter=UnlessKinematicPairs
; [V] 0.2 x speed = 2 m/s (PxSceneDesc.h:1082), written in cm/s; the profile's RestitutionThresholdVelocity wins when given
BounceThresholdVelocity=200
; [V] PxSceneQueryDesc.h:271
DynamicTreeRebuildRateHint=100
; [V] PxScene::simulate without a scratch block
ScratchMemorySize=0
; [V] PxsBodyCore::init solverIterationCounts (1 << 8) | 4: position 4, velocity 1 (PxvDynamics.h:116)
PositionIterations=4
VelocityIterations=1
; [V] PxShape default contact offset 0.02 x PxTolerancesScale::length
ContactOffsetRule=SdkDefault
; [D] createMaterial(max(F, SF), F, R): PhysX's own pair combine (static = max(C(SF0, SF1), C(F0, F1)),
; PxsMaterialCombiner.h:92-105 [V]) then gives exactly the Chaos pair rule
StaticFrictionRule=MaxOfStaticAndDynamic
; [V] the default thresholds as they are: 5e-5 / 2.5e-5 x speed^2 (PxvDynamics.h:132, :136)
SleepThresholdRule=SdkDefault
; [V] an unset body keeps PhysX's unlimited default (maxPenBias -1e32, PxvDynamics.h init)
MaxDepenetrationRule=SdkDefault
; [V] PxDefaultCpuDispatcherCreate (T = 1: 0 workers, every task inline, ExtDefaultCpuDispatcher.cpp:109-114)
CpuDispatcher=PxDefault
