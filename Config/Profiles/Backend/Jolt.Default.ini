; Jolt.Default.ini - backend variant "Jolt with its native solver settings" (docs/02_Architecture.md 8.3, 10; 03 M3/M5).
; [MVP M3: created with the Jolt backend; M5 adds the other variants, M9 completes the profiles]
; A variant may set only [PhysicsTest.Backend.Jolt] keys and the keys the physics profile marks EngineDefault
; (02 10). Every value below is Jolt 5.6.0's own default, stated explicitly; lengths are in cm (the backend converts to m).
; Evidence tags: [V] read in the pinned Jolt source (out/<preset>/_deps/jolt-src, e77f1755).

[PhysicsTest.Variant]
Engine=Jolt
Name=Default
Label=Jolt 5.6.0 (native solver settings)
+FidelityNotes=Jolt keeps one friction coefficient per pair: the UE static-friction pair rule is not representable (material.static_friction_rule=dynamic_only, DL41)
+FidelityNotes=Speculative contacts are always on (by design, 02 10); no per-body max depenetration velocity or inertia conditioning
+FidelityNotes=Sleep thresholds are global in Jolt: UE's per-material linear threshold and counter are mapped approximately (min / 2 and (max + 1) frames; the angular threshold is not mapped), see the effective key jolt.sleep_mapping (M9)
+FidelityNotes=Joints: PointConstraint / HingeConstraint without projection (Jolt has none; Chaos keeps UE's bEnableProjection, by design, docs/Abi.md 9.4)

[PhysicsTest.Backend.Jolt]
; [V] PhysicsSettings.h: mNumVelocitySteps = 10, mNumPositionSteps = 2
NumVelocitySteps=10
NumPositionSteps=2
; [V] PhysicsSettings.h:16 cDefaultConvexRadius = 0.05 m (Jolt.SharpBoxes, M9, sets 0)
ConvexRadius=5.0
; [V] PhysicsSettings.h:53 mPenetrationSlop = 0.02 m; mSpeculativeContactDistance = 0.02 m; mBaumgarte = 0.2
PenetrationSlop=2.0
SpeculativeContactDistance=2.0
Baumgarte=0.2
; [V] PhysicsSettings.h:105, :120: mDeterministicSimulation = true (Jolt's own determinism switch, not UE's
; bEnableEnhancedDeterminism: the backend does not map PT_SIM_ENHANCED_DETERMINISM to it), mUseLargeIslandSplitter = true.
; Stated in M6 so that G9 compares the readback determinism.flag with a resolved value.
DeterministicSimulation=True
UseLargeIslandSplitter=True
; M9: the UE material sleep thresholds mapped onto Jolt's global sleep test (02 10 UEParity "UE material thresholds", Q11;
; approximation recorded in the effective key jolt.sleep_mapping). Native = Jolt's own PhysicsSettings mPointVelocitySleepThreshold
; 0.03 m/s and mTimeBeforeSleep 0.5 s (PhysicsSettings.h:95, :102 [V]). Unused when the profile turns sleep off (Normalized).
SleepThresholdMapping=UE
