; PhysX.UE4Compat.ini - backend variant "UE4 settings on PhysX 5.11", the main PhysX row (docs/02_Architecture.md 8.2, 10;
; 03 M5). UE4's integration shape (PhysXSupport, InitGamePhys, FPhysScene_PhysX::InitPhysScene, the filter shader, the
; FInitBodiesHelper creation order) is re-implemented clean room in Source/Backends/PhysXBackend; this file holds every
; UE4-derived setting so that each one can be switched after checking it in UE 4.27, without a code change.
; A variant may set only [PhysicsTest.Backend.PhysX] / [PhysicsTest.Backend.PhysX.Init] keys and the keys the physics
; profile marks EngineDefault (02 10). Lengths are in cm and velocities in cm/s (the backend converts with LengthScale).
; The backend's built-in defaults are this file's values, and a PhysX run that names no variant resolves this file
; (DefaultForEngine below): a PhysX run without -BackendProfile= is this row.
; Evidence tags: [V] read in the pinned PhysX source (out/<preset>/_deps/physx-src, da950a35) or the local UE 5.8.3 source
; (the PhysX-era UPhysicsSettingsCore fields still exist there, 01_Feasibility 2.2); [M] UE4 behaviour re-implemented from
; the design text (clean room: nothing from a UE4 source mirror), switchable here; [D] harness design decision.

[PhysicsTest.Variant]
Engine=PhysX
Name=UE4Compat
; [D] PhysX's default variant: a run that names no PhysX variant file (a bench run without -BackendProfile=, the viewer's
; "(Default / none)") resolves this file, so every PhysX manifest carries this row's label and fidelity notes (02 8.2) and
; the UE4PhysSubstep clamp rule below (LoadBenchConfig: <Backend>.Default.ini, else the one variant marked DefaultForEngine).
DefaultForEngine=True
Label=UE4 settings on PhysX 5.11
+FidelityNotes=UE4 settings on PhysX 5.11: UE4 shipped PhysX 3.4.0.0 (UE 5.8.3 Engine/Binaries/ThirdParty/PhysX3 FileVersion), not PhysX 5.11
+FidelityNotes=PhysX 5.11 differs from 3.4: improved patch friction is always on, joint projection and the eSWING drive are gone, PxCooking is gone (PxCreateConvexMesh), max depenetration velocity must be > 0, the default broad phase is PABP (set to SAP here)
+FidelityNotes=Same tolerances scale (100, 1000) as UE4Compat-TGS and UE4Compat-Stab: the three may share one process; SdkDefault needs its own

[PhysicsTest.Backend.PhysX.Init]
; [V] UE PhysicsCore/Private/PhysicsInitialization.cpp:18-28 (p.ToleranceScale_Length 100, p.ToleranceScale_Speed 1000):
; one PxTolerancesScale per process (PxPhysics.h:997 [V]), so this is an InitGamePhys option. (100, 1000) is the backend's
; InitGamePhys default, read back as physx.tolerances_length / _speed, so the UE4Compat family states no init key: the
; registry compares init options as text (GLOBAL_SCENE_SETTINGS), and PhysX without a variant (the viewer's
; "(Default / none)", a bench run without -BackendProfile) must share the process with UE4Compat / -TGS / -Stab exactly
; as the three share it with each other (M5; the same rule as Bullet.Default's empty .Init section). Only SdkDefault sets it.
;ToleranceScale=(Length=100,Speed=1000)

[PhysicsTest.Backend.PhysX]
; [D] D1: UE4's PhysX ran in cm (1 native unit = 1 cm)
LengthScale=1
; [M] UE4 used SAP (PhysX 3.4's default); [V] PhysX 5.11's default is ePABP (PxSceneDesc.h:1076)
BroadPhaseType=SAP
; [V] ePGS (UE4's solver; PxSceneDesc.h:1081 default)
SolverType=PGS
; [V] UPhysicsSettingsCore defaults (PhysicsSettingsCore.cpp:27-49): bEnablePCM true, bEnableStabilization false,
; bEnableEnhancedDeterminism false
bEnablePCM=True
bEnableStabilization=False
bEnableEnhancedDeterminism=False
; [M] UE4 sets the scene CCD flag; bodies opt in with bUseCCD
bEnableCCD=True
; [M] UE4 syncs poses through the active actor list (eENABLE_ACTIVE_ACTORS | eEXCLUDE_KINEMATICS_FROM_ACTIVE_ACTORS)
bEnableActiveActors=True
; [M] UE4 keeps kinematic pairs in the scene and lets its filter shader suppress them
KineKineFilteringMode=Keep
StaticKineFilteringMode=Keep
; [M] the two filter shader outcomes the design text leaves open (PhysicsFiltering.h), to check in UE 4.27 (03 2):
; a pair that does not block mutually is killed (Kill) or suppressed (Suppress); a kinematic-static pair is suppressed
; unless a shape asks for kinematic pairs (UnlessKinematicPairs) or always (Always). The values here are the reading of the
; design text; a reviewer recalls Suppress / Always for UE4 (unconfirmed, Progress M5 round 0). No M5 scene reaches either.
NonBlockingPairFilter=Kill
KinematicStaticPairFilter=UnlessKinematicPairs
; [V] BounceThresholdVelocity 200 cm/s (PhysicsSettingsCore.cpp:27-49; also 0.2 x speed, PxSceneDesc.h:1082). Used when
; the profile gives no RestitutionThresholdVelocity (UEParity, DL35); Normalized's 50 cm/s wins otherwise
BounceThresholdVelocity=200
; [V] PhysXTreeRebuildRate 10 (Engine PhysicsSettings.cpp:21-27)
DynamicTreeRebuildRateHint=10
; [V] SimulateScratchMemorySize 262144 (PhysicsSettingsCore.cpp:27-49), passed to PxScene::simulate
ScratchMemorySize=262144
; [M] UE4 FBodyInstance PositionSolverIterationCount 8 / VelocitySolverIterationCount 1 for bodies that do not override
; (UE5's defaults are 8 / 2; PhysX's own are 4 / 1, PxvDynamics.h [V])
PositionIterations=8
VelocityIterations=1
; [M] formula clamp(ContactOffsetMultiplier x MinExtent, MinContactOffset, MaxContactOffset) per element (MinExtent = radius
; or smallest half extent); [V] constants 0.02 / 2 cm / 8 cm (PhysicsSettingsCore.cpp:27-49)
ContactOffsetRule=UE4Clamp
ContactOffsetMultiplier=0.02
MinContactOffset=2
MaxContactOffset=8
; [M] UE4 creates every material as createMaterial(F, F, R): static friction = dynamic friction
StaticFrictionRule=EqualsDynamic
; [M] UE4: the PhysX default sleep / stabilisation thresholds (50 / 25 at (100, 1000), PxvDynamics.h [V]) times the body's
; SleepFamily and stabilisation multipliers
SleepThresholdRule=UE4Multiplier
; [M] UE4: a body without an override uses the project MaxDepenetrationVelocity, and 0 means unlimited (PX_MAX_F32);
; [V] project default 0 (PhysicsSettingsCore.cpp:27-49)
MaxDepenetrationRule=UE4Project
ProjectMaxDepenetrationVelocity=0
; [M] UE4: FPhysXCPUDispatcherSingleThread at T = 1, the PhysX worker pool (PxDefaultCpuDispatcherCreate(T)) otherwise
CpuDispatcher=Auto

[/Script/PhysicsTest.PhysicsTestSettings]
; [M] UE4's FPhysSubstepTask substep rule (harness planner, EngineDefault key; only Substepping tick mode uses it)
SubstepClampRule=UE4PhysSubstep
