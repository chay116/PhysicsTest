; Jolt.SharpBoxes.ini - backend variant "Jolt with sharp boxes" (docs/02_Architecture.md 8.1, 8.3, 10; 03 M9 profile completion).
; [확장 M9: created by the harness prep; the Jolt implementer adds further engine keys if the M9 profile work needs them]
; Jolt.Default with ConvexRadius 0: Jolt's boxes are rounded by default (cDefaultConvexRadius 0.05 m), the other engines'
; boxes are sharp (PhysX exact boxes + contact offset; Chaos margin min(5 % of the size, 10 cm), 01 2.3). With radius 0 the
; Jolt box is an exact box (GJK on the sharp shape): the M2b.Pyramid1240 source scene uses 0 (docs/Scenes.md 2.15), and the
; M9 behaviour scenes compare the two Jolt variants (by-design difference of the margin policy, not of the solver).
; Everything else is Jolt.Default's (Jolt 5.6.0's own defaults, stated explicitly). A variant may set only
; [PhysicsTest.Backend.Jolt] keys and the keys the physics profile marks EngineDefault (02 10).
; Evidence tags: [V] read in the pinned Jolt source (out/<preset>/_deps/jolt-src, e77f1755).
; Gates: not in the 03 gate list (GetOptInGateVariants): reported "not gated" until a lead adds it.

[PhysicsTest.Variant]
Engine=Jolt
Name=SharpBoxes
Label=Jolt 5.6.0 (sharp boxes: convex radius 0)
+FidelityNotes=Jolt keeps one friction coefficient per pair: the UE static-friction pair rule is not representable (material.static_friction_rule=dynamic_only, DL41)
+FidelityNotes=Speculative contacts are always on (by design, 02 10); no per-body max depenetration velocity or inertia conditioning
+FidelityNotes=Boxes are sharp (ConvexRadius 0): GJK runs on the exact box instead of the rounded core (Jolt.Default keeps 5 cm)
+FidelityNotes=Sleep thresholds are global in Jolt: UE's per-material linear threshold and counter are mapped approximately (min / 2 and (max + 1) frames; the angular threshold is not mapped), see the effective key jolt.sleep_mapping (M9)
+FidelityNotes=Joints: PointConstraint / HingeConstraint without projection (Jolt has none; Chaos keeps UE's bEnableProjection, by design, docs/Abi.md 9.4)

[PhysicsTest.Backend.Jolt]
; [V] PhysicsSettings.h: mNumVelocitySteps = 10, mNumPositionSteps = 2
NumVelocitySteps=10
NumPositionSteps=2
; [V] PhysicsSettings.h:16 cDefaultConvexRadius = 0.05 m; this variant: 0 (sharp boxes)
ConvexRadius=0.0
; [V] PhysicsSettings.h:53 mPenetrationSlop = 0.02 m; mSpeculativeContactDistance = 0.02 m; mBaumgarte = 0.2
PenetrationSlop=2.0
SpeculativeContactDistance=2.0
Baumgarte=0.2
; [V] PhysicsSettings.h:105, :120: mDeterministicSimulation = true, mUseLargeIslandSplitter = true (as Jolt.Default)
DeterministicSimulation=True
UseLargeIslandSplitter=True
; M9: the UE material sleep thresholds mapped onto Jolt's global sleep test (as Jolt.Default; jolt.sleep_mapping)
SleepThresholdMapping=UE
