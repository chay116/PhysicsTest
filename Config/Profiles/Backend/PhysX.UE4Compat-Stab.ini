; PhysX.UE4Compat-Stab.ini - backend variant "UE4Compat with eENABLE_STABILIZATION" (docs/02_Architecture.md 8.2, 10;
; 03 M5). Every key equals PhysX.UE4Compat.ini except bEnableStabilization (UE4's project switch, off by default). The
; tolerances scale stays (100, 1000), so this variant shares a process with UE4Compat and UE4Compat-TGS. The probe of
; 01_Feasibility 3.2 [V]: a 10-box stack that sways about 25 cm under PGS 8/1 settles in about 1 s with stabilization.
; A variant may set only [PhysicsTest.Backend.PhysX] / [PhysicsTest.Backend.PhysX.Init] keys and the keys the physics
; profile marks EngineDefault (02 10). Lengths are in cm and velocities in cm/s.
; Evidence tags: [V] read in the pinned PhysX source (out/<preset>/_deps/physx-src, da950a35) or the local UE 5.8.3 source;
; [M] UE4 behaviour re-implemented from the design text (clean room), switchable here; [D] harness design decision.

[PhysicsTest.Variant]
Engine=PhysX
Name=UE4Compat-Stab
Label=UE4 settings on PhysX 5.11, stabilization on
+FidelityNotes=UE4 settings on PhysX 5.11: UE4 shipped PhysX 3.4.0.0 (UE 5.8.3 Engine/Binaries/ThirdParty/PhysX3 FileVersion), not PhysX 5.11
+FidelityNotes=PhysX 5.11 differs from 3.4: improved patch friction is always on, joint projection and the eSWING drive are gone, PxCooking is gone (PxCreateConvexMesh), max depenetration velocity must be > 0, the default broad phase is PABP (set to SAP here)
+FidelityNotes=UE4's project switch bEnableStabilization turned on (UE4 default off)

[PhysicsTest.Backend.PhysX.Init]
; [V] UE PhysicsCore/Private/PhysicsInitialization.cpp:18-28: (100, 1000), shared with UE4Compat and UE4Compat-TGS; the
; backend's InitGamePhys default, so not stated as a key (see PhysX.UE4Compat.ini: the family and PhysX without a variant
; share one process)
;ToleranceScale=(Length=100,Speed=1000)

[PhysicsTest.Backend.PhysX]
; [D] D1: cm
LengthScale=1
; [M] UE4 used SAP; [V] 5.11 default ePABP (PxSceneDesc.h:1076)
BroadPhaseType=SAP
; [V] PxSolverType::ePGS
SolverType=PGS
; [V] PhysicsSettingsCore.cpp:27-49 (bEnablePCM true, bEnableEnhancedDeterminism false); bEnableStabilization is the
; one difference from UE4Compat ([V] UE4's project setting, here on)
bEnablePCM=True
bEnableStabilization=True
bEnableEnhancedDeterminism=False
; [V] bDisableCCD false (PhysicsSettings.h:305, zero-initialised); [M] mapped to the scene CCD flag
bEnableCCD=True
; [V] bDisableActiveActors(false) (PhysicsSettings.cpp:18); [M] mapped to the active actor sync
bEnableActiveActors=True
; [V] bDisableKinematicStatic/KinematicPairs false (PhysicsSettings.h:296, :300); [M] pairs kept, the filter shader suppresses them
KineKineFilteringMode=Keep
StaticKineFilteringMode=Keep
; [M] the two filter shader outcomes the design text leaves open (PhysicsFiltering.h), to check in UE 4.27 (03 2):
; a pair that does not block mutually is killed (Kill) or suppressed (Suppress); a kinematic-static pair is suppressed
; unless a shape asks for kinematic pairs (UnlessKinematicPairs) or always (Always). The values here are the reading of the
; design text; a reviewer recalls Suppress / Always for UE4 (unconfirmed, Progress M5 round 0). No M5 scene reaches either.
NonBlockingPairFilter=Kill
KinematicStaticPairFilter=UnlessKinematicPairs
; [V] PhysicsSettingsCore.cpp:27-49 (cm/s)
BounceThresholdVelocity=200
; [V] PhysicsSettings.cpp:21-27
DynamicTreeRebuildRateHint=10
; [V] PhysicsSettingsCore.cpp:27-49
ScratchMemorySize=262144
; [M] UE4 FBodyInstance 8 / 1
PositionIterations=8
VelocityIterations=1
; [M] formula, [V] constants (PhysicsSettingsCore.cpp:27-49)
ContactOffsetRule=UE4Clamp
ContactOffsetMultiplier=0.02
MinContactOffset=2
MaxContactOffset=8
; [M] createMaterial(F, F, R)
StaticFrictionRule=EqualsDynamic
; [M] PhysX default thresholds x the body's multipliers (the stabilization threshold is 25 at (100, 1000), PxvDynamics.h:136 [V])
SleepThresholdRule=UE4Multiplier
; [M] project MaxDepenetrationVelocity, 0 = unlimited; [V] default 0 (zero-initialised, PhysicsSettingsCore.h:93-95)
MaxDepenetrationRule=UE4Project
ProjectMaxDepenetrationVelocity=0
; [M] FPhysXCPUDispatcherSingleThread at T = 1
CpuDispatcher=Auto
; [V] eENABLE_GYROSCOPIC_FORCES is PhysX 5.1+ (CHANGELOG.md:2056); UE4 / PhysX 3.4 had no gyroscopic term [R] (M6)
GyroscopicForces=Ignore
; [M] UE4's FConstraintInstance on PhysX (M9): PxD6Joint, PxD6JointCreate(SDK, actor2, frame2, actor1, frame1) - the parent
; is actor0 (see PhysX.UE4Compat.ini); no joint projection in PhysX 5.11 (CHANGELOG.md:1703 [V], effective joint.projection 0)
JointRecipe=D6
JointActorOrder=ParentFirst
; [D] native debug draw (M9), viz runs only (see PhysX.UE4Compat.ini)
DebugVisualization=CollisionShapes,JointLocalFrames,JointLimits,ContactNormals

[/Script/PhysicsTest.PhysicsTestSettings]
; [M] UE4's FPhysSubstepTask substep rule (Substepping tick mode only)
SubstepClampRule=UE4PhysSubstep
