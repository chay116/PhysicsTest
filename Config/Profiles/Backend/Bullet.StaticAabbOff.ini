; Bullet.StaticAabbOff.ini - backend variant "Bullet without the per-step AABB update of static objects" (docs/02_Architecture.md
; 8.4, 10, 14.3 G11; 03 M9 profile completion).
; [확장 M9: created by the harness prep; the Bullet implementer adds further engine keys if the M9 profile work needs them]
; Bullet.Default with ForceUpdateAllAabbs = false: btCollisionWorld::updateAabbs then updates only active objects and skips
; the inactive ones (static bodies, sleeping bodies), which do not move (btCollisionWorld.cpp:197-212 [V]). Meant as a speed knob
; whose per-frame hashes equal Bullet.Default's (03 M9 G11 addition: PhysicsTestBench -Gate=G11 -G11Knob=variants:Default,StaticAabbOff).
; M9 (Bullet implementer, Progress M9 F-1 / 03 M9 G11 [V]): that holds frame by frame where the solver order does not follow the
; broad phase's pair order - one body, the joint scenes, M2a.Tower N=10, both profiles - and on M3.BoxPile 1k only with
; bEnableEnhancedDeterminism (btDispatcherInfo::m_deterministicOverlappingPairs sorts the pairs and the island manifolds:
; btOverlappingPairCache.cpp:374, btSimulationIslandManager.cpp:376-378) in Normalized (600 frames). Without it the static ground's
; proxy moves to the fixed tree after two steps without an update (btDbvtBroadphase.cpp:319-329, collide), the trees report the
; pairs in another order and the pile parts at frame 51 (UEParity) / 54 (Normalized). With it in UEParity the pile parts at frame
; 408: the sleeping bodies' AABBs are the variant's only other difference (the ground alone is neutral, as Normalized shows). [R]
; A body keeps the AABB of its last awake step, which includes the motion-swept part (btCollisionWorld::updateSingleAabb,
; m_useContinuous), while the default variant recomputes it at rest - other broad-phase pairs, other islands. Not result-neutral
; in general.
; Everything else is Bullet.Default's (Bullet 3.25's own defaults, DampingModel=UE the harness rule). A variant may set only
; [PhysicsTest.Backend.Bullet] / [PhysicsTest.Backend.Bullet.Init] keys and the keys the physics profile marks EngineDefault
; (02 10). It sets no init key, so it shares a process with Bullet.Default (PT_MODULE_GLOBAL_SCENE_SETTINGS).
; Evidence tags: [V] read in the pinned Bullet source (out/<preset>/_deps/bullet3-src, 2c204c49); [D] harness design decision.
; Gates: not in the 03 gate list (GetOptInGateVariants): reported "not gated" until a lead adds it.

[PhysicsTest.Variant]
Engine=Bullet
Name=StaticAabbOff
Label=Bullet 3.25 (static AABBs not updated per step)
+FidelityNotes=Bullet keeps one friction coefficient per contact point: the UE static-friction pair rule is not representable (material.static_friction_rule=dynamic_only, DL41)
+FidelityNotes=Damping is applied in UE's order (after the forces) by an internal pre-tick; Bullet itself damps before integrating forces (bullet.damping_model, PtDamping.h)
+FidelityNotes=Above pi/4 per step (47.1 rad/s at 60 Hz) Bullet under-rotates bodies (btTransformUtil.h integrateTransform; bullet.angular_motion_limit_hits counts it); no per-body max depenetration velocity or inertia conditioning
+FidelityNotes=Sleep (SleepThresholds=UE, approximate): UE's material thresholds x SleepThresholdMultiplier as Bullet's per-body thresholds and the material's SleepCounterThreshold as consecutive steps; Bullet tests the step's velocity (Chaos a smoothed one) and sleeps an island when every body wants to (bullet.sleep_rule)
+FidelityNotes=Joints (M9): ball = btPoint2PointConstraint, hinge = btHingeConstraint, hard, solved by the contact solver's iterations; no projection (joint.projection 0)
+FidelityNotes=Inactive objects' AABBs (static, sleeping) are not recomputed every step (ForceUpdateAllAabbs=false): bit-identical to Bullet.Default on single-body and joint scenes; on piles the broad phase finds pairs in another order and the solver order follows (G11 / Progress M9 F-1)

[PhysicsTest.Backend.Bullet]
; [V] btContactSolverInfo.h:77-113: m_numIterations = 10, m_solverMode = SOLVER_USE_WARMSTARTING | SOLVER_SIMD (0x104)
NumIterations=10
SolverMode=0x104
; [V] btContactSolverInfo.h: m_splitImpulse = true, m_splitImpulsePenetrationThreshold = -0.04 m, m_splitImpulseTurnErp = 0.1
SplitImpulse=true
SplitImpulsePenetrationThreshold=-4.0
SplitImpulseTurnErp=0.1
; [V] btContactSolverInfo.h: m_erp2 = 0.2 (contacts), m_linearSlop = 0, m_warmstartingFactor = 0.85
Erp2=0.2
LinearSlop=0.0
WarmstartingFactor=0.85
; [V] btRigidBody.h:154-155 btRigidBodyConstructionInfo: m_linearSleepingThreshold = 0.8 m/s, m_angularSleepingThreshold = 1 rad/s
; (kinematic bodies; dynamic bodies with SleepThresholds=Bullet)
LinearSleepingThreshold=80.0
AngularSleepingThreshold=1.0
; [V] btCollisionWorld.cpp:71 m_forceUpdateAllAabbs = true; this variant: false (only active objects' AABBs per step)
ForceUpdateAllAabbs=false
; [D] harness choice (as Bullet.Default): UE = UE's damping order through the internal pre-tick (PtDamping.h)
DampingModel=UE
; [D] M9, as Bullet.Default (see there): UEParity's approximate UE sleep mapping, the docs/Abi.md 9.4 ball joint
SleepThresholds=UE
BallJoint=Point2Point
