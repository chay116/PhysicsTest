; Bullet.Default.ini - backend variant "Bullet with its native solver settings" (docs/02_Architecture.md 8.4, 10; 03 M5).
; [MVP M5: created with the Bullet backend; M9 completes the profiles]
; A variant may set only [PhysicsTest.Backend.Bullet] / [PhysicsTest.Backend.Bullet.Init] keys and the keys the physics
; profile marks EngineDefault (02 10). Every value below is Bullet 3.25's own default, stated explicitly; lengths are in cm
; (the backend converts to m).
; Evidence tags: [V] read in the pinned Bullet source (out/<preset>/_deps/bullet3-src, 2c204c49).
;
; Module options ([PhysicsTest.Backend.Bullet.Init]): Bullet keeps them in process globals, so the module declares
; PT_MODULE_GLOBAL_SCENE_SETTINGS and a process holds one set (a variant that sets another value runs in its own process;
; the viewer relaunches, 03 1.6). This variant sets none, so it shares a process with every config-less scene. The keys
; and their defaults (the values without the section):
;   CombineRule=UE                 ; UE / Bullet. UE: PtCombine through gCalculateCombined*Callback (DL41, the default);
;                                  ; Bullet: [V] btManifoldResult.cpp:56-71 F0*F1 clamped to 10, R0*R1
;   DeactivationTime=2.0           ; [V] btRigidBody.cpp:25 gDeactivationTime = 2 s; must be > 0 (0 disables sleep,
;                                  ; btRigidBody.h:522: turn sleep off in the physics profile instead)
;   ContactBreakingThreshold=0.02  ; [V] btPersistentManifold.cpp:26 gContactBreakingThreshold = 0.02, as Bullet takes it: a
;                                  ; factor of each shape's angular motion disc for the manifold breaking threshold (the
;                                  ; dispatcher's default CD_USE_RELATIVE_CONTACT_BREAKING_THRESHOLD, btCollisionDispatcher.cpp:32,
;                                  ; :74-75; about 0.87 cm for a 50 cm cube) and the broad-phase AABB inflation in m
;                                  ; (btCollisionWorld.cpp:153-160). Not a length in cm (M5 round 0)

[PhysicsTest.Variant]
Engine=Bullet
Name=Default
Label=Bullet 3.25 (native solver settings)
+FidelityNotes=Bullet keeps one friction coefficient per contact point: the UE static-friction pair rule is not representable (material.static_friction_rule=dynamic_only, DL41)
+FidelityNotes=Damping is applied in UE's order (after the forces) by an internal pre-tick; Bullet itself damps before integrating forces (bullet.damping_model, PtDamping.h)
+FidelityNotes=Above pi/4 per step (47.1 rad/s at 60 Hz) Bullet under-rotates bodies (btTransformUtil.h integrateTransform; bullet.angular_motion_limit_hits counts it); no per-body max depenetration velocity or inertia conditioning
+FidelityNotes=Sleep uses Bullet's own per-body thresholds and deactivation time; the UE material thresholds are mapped in M9

[PhysicsTest.Backend.Bullet]
; [V] btContactSolverInfo.h:77-113: m_numIterations = 10, m_solverMode = SOLVER_USE_WARMSTARTING | SOLVER_SIMD (0x104)
NumIterations=10
SolverMode=0x104
; [V] btContactSolverInfo.h: m_splitImpulse = true, m_splitImpulsePenetrationThreshold = -0.04 m, m_splitImpulseTurnErp = 0.1
SplitImpulse=true
SplitImpulsePenetrationThreshold=-4.0
SplitImpulseTurnErp=0.1
; [V] btContactSolverInfo.h: m_erp2 = 0.2 (contacts), m_linearSlop = 0, m_warmstartingFactor = 0.85
Erp2=0.2
LinearSlop=0.0
WarmstartingFactor=0.85
; [V] btRigidBody.h:154-155 btRigidBodyConstructionInfo: m_linearSleepingThreshold = 0.8 m/s, m_angularSleepingThreshold = 1 rad/s
LinearSleepingThreshold=80.0
AngularSleepingThreshold=1.0
; [V] btCollisionWorld.cpp:71 m_forceUpdateAllAabbs = true
ForceUpdateAllAabbs=true
; UE: UE's damping order through the internal pre-tick (the harness rule, PtDamping.h); Converted: Bullet's own damping
; with c_b = 1 - (1 - c dt)^(1/dt) (02 8.1) in Bullet's order
DampingModel=UE
