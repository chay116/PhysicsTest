; Normalized.ini - physics profile "remove engine-specific damping, clamps, combine and sleep" (docs/02_Architecture.md 10).
; [MVP M1 draft; M9: ForcedOverrides, Version 2]. Layered on Config/BasePhysicsTest.ini; variants may set only their own
; engine keys and the EngineDefaultKeys below (02 10).
;
; 02 10 table, Normalized column:
;   gravity (0,0,-980)                  Base
;   damping 0 / 0                       below
;   max angular velocity released       below: an override far above any reachable speed. NOT 0 - Chaos clamps to
;                                       MaxAngularSpeedSq, so 0 would stop every rotation (PBDRigidsEvolutionGBF.cpp:950-954 [V]).
;                                       Bullet's own limit stays: above pi/4 per step (47.1 rad/s at 60 Hz)
;                                       btTransformUtil::integrateTransform turns the body by less than |w| dt and
;                                       keeps the velocity (COMPILE_TIME bullet.angular_motion_threshold, DL16 as
;                                       corrected in M5; the pi/(2 dt) = 94.2 rad/s of btRigidBody.cpp:380-385 is
;                                       integrateVelocities, which btDiscreteDynamicsWorld never calls)
;   max linear velocity                 released (backends)
;   combine                             Average forced and static = dynamic (SF := F): the project modes are Average here,
;                                       and [/Script/PhysicsTest.ForcedOverrides] (M9) forces every material after
;                                       authoring (a scene's bOverride*CombineMode included). Gate scenes and the gates keep
;                                       their authored values (S05 / S06 need their own modes, docs/Scenes.md 2.9, 2.10)
;   restitution threshold               50 cm/s for every engine (Chaos: p.CollisionRestitutionThreshold = 50 / dt, an
;                                       acceleration, PBDCollisionConstraints.cpp:69 [V])
;   sleep                               off (PhysX eDISABLE_SLEEPING, Chaos p.Chaos.Solver.Sleep.Enabled=0, Jolt
;                                       mAllowSleeping=false, Bullet DISABLE_DEACTIVATION; DL48); the start-asleep step is
;                                       skipped (02 6)
;   mass rule                           UEBodyUtils, as UEParity (DL17: not tied to the profile)
;   gyroscopic / CCD                    off / off
;   iterations                          EngineDefault, as UEParity (Mode C sweep: M15)
;   inertia conditioning                off

[PhysicsTest.Profile]
Name=Normalized
Version=2
+EngineDefaultKeys=PhysicsTestSettings.SubstepClampRule
+EngineDefaultKeys=BodyInstanceDefaults.bOverrideIterationCounts
+EngineDefaultKeys=BodyInstanceDefaults.PositionSolverIterationCount
+EngineDefaultKeys=BodyInstanceDefaults.VelocitySolverIterationCount
+EngineDefaultKeys=BodyInstanceDefaults.ProjectionSolverIterationCount

[/Script/PhysicsTest.PhysicsTestSettings]
bAllowSleeping=False
RestitutionThresholdVelocity=50.0
MassRule=UEBodyUtils

[/Script/PhysicsTest.BodyInstanceDefaults]
LinearDamping=0.0
AngularDamping=0.0
bOverrideMaxAngularVelocity=True
; deg/s. 1e7 deg/s (~1.75e5 rad/s, ~2900 rad per 1/60 s step) is far beyond any reachable speed, so nothing is
; clamped. Not UE_BIG_NUMBER (3.4e+38): the engines square the limit in rad/s in float (Chaos MMaxAngularSpeedSq is
; FRealSingle, ParticleDirtyFlags.h:579, :646; Jolt Square(mMaxAngularVelocity), MotionProperties.inl:39; PhysX
; PxReal maxAngularVelocitySq, PxvDynamics.h:74), and (5.9e36)^2 is +inf. Not 0: Chaos clamps
; unconditionally, so 0 stops rotation (PBDRigidsEvolutionGBF.cpp:950-954).
MaxAngularVelocity=1e7
bGyroscopicTorqueEnabled=False
bUseCCD=False
bInertiaConditioning=False

[/Script/Engine.PhysicsSettings]
FrictionCombineMode=Average
RestitutionCombineMode=Average

; M9 (02 10): applied by FPhysScene after authoring, with a log (FlushDeferredActors; manifest profile.forced_overrides).
; Every material of a flushed body gets the project's Average modes as overrides, and its static friction becomes its
; friction (SF := F; the token Friction). With SF <= F (UE's default SF is 0) the pair's static friction is unchanged on
; every engine (Chaos max(F, SF), PhysX SdkDefault max(F, SF), UE4Compat and Jolt / Bullet dynamic only, DL41); the
; marshalled bytes change, so desc_sha256 of Normalized differs from M8's.
[/Script/PhysicsTest.ForcedOverrides]
PhysicalMaterial.FrictionCombineMode=Average
PhysicalMaterial.bOverrideFrictionCombineMode=True
PhysicalMaterial.RestitutionCombineMode=Average
PhysicalMaterial.bOverrideRestitutionCombineMode=True
PhysicalMaterial.StaticFriction=Friction
