; UEParity.ini - physics profile "each engine set to UE defaults" (docs/02_Architecture.md 10). [MVP M1 draft; complete M9]
; Layered on Config/BasePhysicsTest.ini. A backend variant (Config/Profiles/Backend/<Engine>.<Variant>.ini) may set only
; its own [PhysicsTest.Backend.<Engine>] keys and the keys listed as EngineDefaultKeys below; anything else is a load
; error, so a variant cannot quietly change what this profile pins.
;
; 02 10 table, UEParity column, and where each row lives:
;   gravity (0,0,-980)                  Base [/Script/Engine.PhysicsSettings] DefaultGravityZ
;   damping 0.01 / 0                    stated below (UE defaults); Bullet converts the formula in its backend (02 8.1)
;   max angular velocity 62.83 rad/s    project MaxAngularVelocity 3600 deg/s (Base), bodies do not override it;
;                                       Bullet emulates it (DL16)
;   max linear velocity                 unlimited in UE; engine limits (Jolt 500 m/s) are released by the backends (M3/M5)
;   combine                             material modes, default Average; Chaos static-friction rule (DL41)
;   restitution threshold               EngineDefault: Chaos 1000*dt native, PhysX UE4Compat 200 cm/s, Jolt / Bullet the
;                                       Chaos equivalent 1000*dt cm/s (DL35, user question Q11)
;   sleep                               on, UE material thresholds
;   mass rule                           UEBodyUtils (separate axis, DL17)
;   gyroscopic / CCD                    off / off
;   iterations                          EngineDefault: UE mapping (PhysX UE4 8/1, Chaos 8/2/1) or native (Jolt 10/2, Bullet 10)
;   inertia conditioning                on

[PhysicsTest.Profile]
Name=UEParity
Version=1
+EngineDefaultKeys=PhysicsTestSettings.SubstepClampRule
+EngineDefaultKeys=PhysicsTestSettings.RestitutionThresholdVelocity
+EngineDefaultKeys=BodyInstanceDefaults.bOverrideIterationCounts
+EngineDefaultKeys=BodyInstanceDefaults.PositionSolverIterationCount
+EngineDefaultKeys=BodyInstanceDefaults.VelocitySolverIterationCount
+EngineDefaultKeys=BodyInstanceDefaults.ProjectionSolverIterationCount

[/Script/PhysicsTest.PhysicsTestSettings]
bAllowSleeping=True
; <= 0: every engine applies its UEParity mapping (see above)
RestitutionThresholdVelocity=-1.0
MassRule=UEBodyUtils

[/Script/PhysicsTest.BodyInstanceDefaults]
; UE defaults, pinned explicitly so that a reader of this file sees the whole profile (BodyInstance.cpp:357-418 [V]).
LinearDamping=0.01
AngularDamping=0.0
bOverrideMaxAngularVelocity=False
bGyroscopicTorqueEnabled=False
bUseCCD=False
bInertiaConditioning=True

[/Script/Engine.PhysicsSettings]
FrictionCombineMode=Average
RestitutionCombineMode=Average
